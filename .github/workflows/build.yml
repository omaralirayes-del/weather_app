name: Build Flutter APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK with High Performance
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع من جيت هب
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مطلوبة لبناء أندرويد)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد فلاتر مع تفعيل خاصية التخزين المؤقت (Caching) لسرعة خارقة في البناء التالي
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # يمكنك تحديث النسخة حسب رغبتك أو وضع stable
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. جلب الحزم المطلوبة
      - name: Install dependencies
        run: flutter pub get

      # 5. بناء الـ APK بأعلى ضغط وأقل مساحة ممكنة (تقسيم المعماريات)
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # 6. رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل من صفحة Actions في جيت هب
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/apk/release/*.apk
